; PlatformIO Project Configuration File
;
; Waveshare ESP32-S3-Touch-LCD-1.46 (ESP32-S3R8, 16MB Flash, 8MB Octal PSRAM)
; Ekran/Dokunmatik: SPD2010 (QSPI)   IO Genisletici: TCA9554PWR
; RTC: PCF85063   IMU: QMI8658   Pil ADC + TF/microSD (SD_MMC 1-bit)
;
; NOT: Resmi Waveshare ornegi (github.com/waveshareteam/ESP32-S3-Touch-LCD-1.46)
; "Arduino-3.1.1" cekirdegini (ESP-IDF 5.3.2) kullaniyor. Bu surum resmi
; PlatformIO "espressif32" platformunda henuz yok; bu yuzden onu destekleyen
; pioarduino topluluk fork'u (ayni Arduino 3.1.1 / IDF 5.3.2 eslesmesi,
; release 53.03.11) kullaniliyor.

[env:waveshare_esp32s3_touch_lcd_146]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = waveshare_esp32s3_touch_lcd_146
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude

lib_deps =
    lvgl/lvgl@8.3.10
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0
