; PlatformIO Project Configuration File
;
; Ayni kod tabani iki kart icin derlenir (kart farki: include/board.h +
; src/board/<kart>/). Varsayilan env Waveshare'dir; CrowPanel icin:
;   pio run -e crowpanel_advance_28 -t upload
;
; NOT: Resmi Waveshare ornegi (github.com/waveshareteam/ESP32-S3-Touch-LCD-1.46)
; "Arduino-3.1.1" cekirdegini (ESP-IDF 5.3.2) kullaniyor. Bu surum resmi
; PlatformIO "espressif32" platformunda henuz yok; bu yuzden onu destekleyen
; pioarduino topluluk fork'u (ayni Arduino 3.1.1 / IDF 5.3.2 eslesmesi,
; release 53.03.11) kullaniliyor.

[platformio]
; Iki env'i birden yuklemeyi (yanlis karta yazmayi) onlemek icin varsayilan tek env.
default_envs = waveshare_esp32s3_touch_lcd_146

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Yukleme portu kartin USB seri numarasindan secilir (env'deki custom_usb_serial);
; boylece iki kart takiliyken bile her firmware yalnizca kendi kartina yuklenir.
extra_scripts = pre:tools/select_upload_port.py
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DLV_CONF_INCLUDE_SIMPLE=1
    -Iinclude
lib_deps =
    lvgl/lvgl@8.3.10
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.1.0

; Waveshare ESP32-S3-Touch-LCD-1.46 (ESP32-S3R8, 16MB Flash, 8MB Octal PSRAM)
; Ekran/Dokunmatik: SPD2010 (QSPI)   IO Genisletici: TCA9554PWR
; RTC: PCF85063   IMU: QMI8658   Pil ADC + TF/microSD (SD_MMC 1-bit)
[env:waveshare_esp32s3_touch_lcd_146]
platform = ${common.platform}
framework = ${common.framework}
board = waveshare_esp32s3_touch_lcd_146
custom_usb_serial = 44:1B:F6:84:FC:08
extra_scripts = ${common.extra_scripts}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
; Kart soyutlamasi: yalnizca bu kartin board_impl + vendor klasoru derlenir.
build_src_filter = +<*> -<board/> +<board/waveshare_146/>
build_flags = ${common.build_flags}
lib_deps = ${common.lib_deps}

; Elecrow CrowPanel Advance 2.8" V1.1/V1.2 (ESP32-S3-WROOM-1-N16R8)
; Ekran: ST7789 SPI 320x240   Dokunmatik: FT6336U (I2C)   SD: SPI
; Ekran/dokunmatik Elecrow orneklerindeki gibi LovyanGFX ile surulur.
[env:crowpanel_advance_28]
platform = ${common.platform}
framework = ${common.framework}
board = crowpanel_advance_28
custom_usb_serial = 44:1B:F6:8C:53:F0
extra_scripts = ${common.extra_scripts}
monitor_speed = ${common.monitor_speed}
monitor_filters = ${common.monitor_filters}
board_build.partitions = ${common.board_build.partitions}
board_build.filesystem = ${common.board_build.filesystem}
build_src_filter = +<*> -<board/> +<board/crowpanel_28/>
build_flags =
    ${common.build_flags}
    -DUI_SCREEN_W=320
    -DUI_SCREEN_H=240
    -DUI_SCREEN_ROUND=0
    ; Siyah-beyaz arayuz (yalnizca bu kart; Waveshare renkli kalir)
    -DUI_THEME_MONO=1
    ; Gelistirici araci: seri porttan ekran goruntusu (SHOT / TILE n / TAP x y)
    -DUI_DEBUG_SCREENSHOT=1
lib_deps =
    ${common.lib_deps}
    lovyan03/LovyanGFX@^1.2.7
